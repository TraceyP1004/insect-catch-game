<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <title>Bunny Boppers</title>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="screen">
        <h1>Bunny Boppers</h1>
        <button class="btn" id="start-btn">Start</button>
    </div>

    <div class="screen">
        <h1> Pick Your Bunny </h1>
        <ul class="bunnys-list">
            <li>
                <button class="choose-bunny-btn">
                    <p>White Bunny</p>
                    <img src="http://pngimg.com/uploads/rabbit/rabbit_PNG3804.png" alt="white bunny">
                </button>
            </li>
            <li>
                <button class = "choose-bunny-btn">
                    <p>Beige Bunny</p>
                    <img
                    src="http://pngimg.com/uploads/rabbit/rabbit_PNG3790.png"
                    alt="beige bunny"
                    />
                </button>
            </li>
            <li>
                <button class = "choose-bunny-btn">
                    <p>Black & White Bunny</p>
                    <img
                    src="http://pngimg.com/uploads/rabbit/rabbit_PNG3777.png"
                    alt="black and white bunny"
                    />
                </button>
            </li>
            <li>
                <button class = "choose-bunny-btn">
                    <p>Brown Bunny</p>
                    <img
                    src="http://pngimg.com/uploads/rabbit/rabbit_PNG3793.png"
                    alt="brown bunny"
                    />
                </button>
                </li>
        </ul>
        </div>

        <div class="screen game-container" id="game-container">
            <h3 id ="time" class="time">Time: 00:00</h3>
            <h3 id="score" class="score">Score: 0</h3>
            <h5 id="message" class="message">
                You know what they say, <br>
                bunnies are good at multiplying! 
            </h5>
        </div>
    </body>
</html>
